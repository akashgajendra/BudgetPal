[project]
name = "budgetpal"
version = "0.2.0"
description = "Upload a bank statement, get a spending dashboard and downloadable report. Runs locally."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pdfplumber>=0.11",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "requests>=2.31",
]

[project.scripts]
budgetpal = "budgetpal.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
